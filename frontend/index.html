<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Product Management System</h1>
  </header>
  
  <div class="container">
    <div id="alert-container"></div>
    
    <div class="tabs">
      <button id="categories-tab" class="tab active">Categories</button>
      <button id="products-tab" class="tab">Products</button>
    </div>
    
    <!-- Categories Tab Content -->
    <div id="categories-content" class="tab-content active">
      <h2>Product Categories</h2>
      
      <div class="form-container">
        <h3 id="category-form-title">Add Category</h3>
        <form id="category-form">
          <div class="form-group">
            <label for="category-description">Description</label>
            <input type="text" id="category-description" name="description" required>
          </div>
          <div class="form-actions">
            <button type="submit" id="category-submit-btn">Create</button>
            <button type="button" class="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
      
      <h3>Categories List</h3>
      <table id="category-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Categories will be loaded here -->
        </tbody>
      </table>
    </div>
    
    <!-- Products Tab Content -->
    <div id="products-content" class="tab-content">
      <h2>Products</h2>
      
      <div class="form-container">
        <h3 id="product-form-title">Add Product</h3>
        <form id="product-form">
          <div class="form-group">
            <label for="product-description">Description</label>
            <input type="text" id="product-description" name="description" required>
          </div>
          <div class="form-group">
            <label for="product-category">Category</label>
            <select id="product-category" name="id_category" required>
              <option value="">Select a category</option>
              <!-- Categories will be loaded here -->
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" id="product-submit-btn">Create</button>
            <button type="button" class="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
      
      <h3>Products List</h3>
      <table id="product-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Products will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
